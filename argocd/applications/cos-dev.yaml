apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cos-dev
  namespace: argocd
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/KaloSora/tencentcloud-infra-gitops.git
    targetRevision: main
    path: environments/dev/cos
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
