apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infrastructure
  namespace: argocd
spec:
  description: Crossplane infrastructure configuration, separate from business applications
  sourceRepos:
    - https://github.com/KaloSora/tencentcloud-infra-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: crossplane-system
  # Explicit APIs required by the staged Provider and COS pilot.
  clusterResourceWhitelist:
    - group: pkg.crossplane.io
      kind: Provider
    - group: pkg.crossplane.io
      kind: DeploymentRuntimeConfig
    - group: tencentcloud.crossplane.io
      kind: ProviderConfig
    - group: cos.tencentcloud.crossplane.io
      kind: Bucket
  # An empty namespace whitelist alone does not deny namespaced resources.
  namespaceResourceBlacklist:
    - group: "*"
      kind: "*"
